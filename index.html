<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Rkz Paciência</title>
  <meta name="description" content="Paciência (Klondike) sem anúncios, que funciona sem internet.">
  <meta name="theme-color" content="#123F23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Paciência">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root">
    <div id="info">
      <span id="tv-score"></span>
      <span id="tv-time"></span>
      <span id="tv-moves"></span>
    </div>
    <!-- A barra de botões fica por cima da mesa e só aparece ao tocar no verde vazio,
         assim as cartas não mudam de tamanho quando ela abre ou fecha. -->
    <div id="stage">
      <canvas id="table"></canvas>
      <div id="bar">
        <button id="btn-new" type="button">
          <svg viewBox="0 0 24 24"><path d="M17.65,6.35C16.2,4.9 14.21,4 12,4c-4.42,0 -7.99,3.58 -7.99,8s3.57,8 7.99,8c3.73,0 6.84,-2.55 7.73,-6h-2.08c-0.82,2.33 -3.04,4 -5.65,4 -3.31,0 -6,-2.69 -6,-6s2.69,-6 6,-6c1.66,0 3.14,0.69 4.22,1.78L13,11h7V4l-2.35,2.35z"/></svg>
          Novo
        </button>
        <button id="btn-undo" type="button">
          <svg viewBox="0 0 24 24"><path d="M12.5,8c-2.65,0 -5.05,0.99 -6.9,2.6L2,7v9h9l-3.62,-3.62c1.39,-1.16 3.16,-1.88 5.12,-1.88 3.54,0 6.55,2.31 7.6,5.5l2.37,-0.78C21.08,11.03 17.15,8 12.5,8z"/></svg>
          Desfazer
        </button>
        <button id="btn-hint" type="button">
          <svg viewBox="0 0 24 24"><path d="M9,21c0,0.55 0.45,1 1,1h4c0.55,0 1,-0.45 1,-1v-1H9v1zM12,2C8.14,2 5,5.14 5,9c0,2.38 1.19,4.47 3,5.74V17c0,0.55 0.45,1 1,1h6c0.55,0 1,-0.45 1,-1v-2.26c1.81,-1.27 3,-3.36 3,-5.74 0,-3.86 -3.14,-7 -7,-7z"/></svg>
          Dica
        </button>
        <button id="btn-auto" type="button" hidden>
          <svg viewBox="0 0 24 24"><path d="M18,7l-1.41,-1.41 -6.34,6.34 1.41,1.41L18,7zM22.24,5.59L11.66,16.17 7.48,12l-1.41,1.41L11.66,19l12,-12 -1.42,-1.41zM0.41,13.41L6,19l1.41,-1.41L1.83,12 0.41,13.41z"/></svg>
          Concluir
        </button>
        <button id="btn-menu" type="button">
          <svg viewBox="0 0 24 24"><path d="M3,18h18v-2H3v2zM3,13h18v-2H3v2zM3,6v2h18V6H3z"/></svg>
          Menu
        </button>
      </div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/game.js"></script>
  <script src="js/analyzer.js"></script>
  <script src="js/userdecks.js"></script>
  <script src="js/cardart.js"></script>
  <script src="js/view.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
